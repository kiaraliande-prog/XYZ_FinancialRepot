name: Update exchange rates (CBUAE + Xe)

# Pulls daily exchange rates (UAE Central Bank for most currencies, Xe.com for
# the Angolan Kwanza, which the CBUAE doesn't publish) and commits them into
# rates.json, which the app reads as the (editable) default conversion rate
# for each transaction's date. Runs every day and can be triggered by hand.

on:
  schedule:
    - cron: "20 5 * * *"   # ~09:20 Gulf time (UTC+4)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CBUAE rates and update rates.json
        run: node .github/scripts/update-rates.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain rates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "Update UAE Central Bank rates ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No rate change today."
          fi
