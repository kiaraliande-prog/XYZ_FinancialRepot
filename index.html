<!--
  window.storage shim
  ------------------------------------------------------------------
  The original app persisted every record through the claude.ai artifact
  runtime's `window.storage` (a real shared, server-side store). A published
  static website has no backend, so this shim maps the same async API onto the
  browser's own localStorage. Behaviour is identical for a single browser; the
  `shared` flag is kept as a key namespace so the app's fallback reads
  (shared -> personal) keep working. Data lives in THIS browser only — use the
  in-app "Generate Report" / Excel export to keep a portable copy.
-->
<script>
(function () {
  var PREFIX = "xyzfr:";
  function keyFor(k, shared) { return PREFIX + (shared ? "shared:" : "local:") + k; }
  function read(k, shared) {
    try {
      var v = localStorage.getItem(keyFor(k, shared));
      return v === null ? null : { value: v };
    } catch (e) { return null; }
  }
  window.storage = {
    // Default to the shared namespace to match the app's SHARED = true default.
    get: function (k, shared) {
      if (shared === undefined) shared = true;
      return Promise.resolve(read(k, shared));
    },
    set: function (k, v, shared) {
      if (shared === undefined) shared = true;
      try { localStorage.setItem(keyFor(k, shared), v); } catch (e) {}
      return Promise.resolve();
    },
    delete: function (k) {
      // Remove from both namespaces so a logout/clear is thorough.
      try { localStorage.removeItem(keyFor(k, true)); } catch (e) {}
      try { localStorage.removeItem(keyFor(k, false)); } catch (e) {}
      return Promise.resolve();
    }
  };
})();
</script>
